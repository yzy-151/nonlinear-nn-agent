[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nonlinear-nn-agent"
version = "4.7.0"
description = "LLM-driven Agent Harness Runtime for nonlinear-system modeling experiments."
requires-python = ">=3.9"
dependencies = [
  "matplotlib",
  "numpy",
  "optuna>=4,<5",
  "pyyaml",
  "scipy",
  "torch",
  "fastapi",
  "uvicorn",
  "langgraph>=0.2,<2",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
retrieval = ["transformers>=4,<6"]
postgres = ["psycopg[binary]>=3,<4"]
pdf-test = ["pymupdf>=1.23,<2"]

[project.scripts]
nonlinear-agent = "nonlinear_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nonlinear_agent = ["web/*.html", "web/*.css", "web/*.js"]
